rules:
  - id: visibility-checker-call
    languages: [java]
    severity: INFO
    message: VisibilityChecker canAccess call
    patterns:
      - pattern: $CHECKER.canAccess(...)
      - metavariable-type:
          metavariable: $CHECKER
          type: VisibilityChecker

  - id: subscription-access-policy-call
    languages: [java]
    severity: INFO
    message: SubscriptionMetadataAccessPolicy eligibility call
    patterns:
      - pattern-either:
          - pattern: $POLICY.canAccessCurrent(...)
          - pattern: $POLICY.canAccessYankedPublication(...)
      - metavariable-type:
          metavariable: $POLICY
          type: SubscriptionMetadataAccessPolicy

  - id: subscription-service-call
    languages: [java]
    severity: INFO
    message: SkillSubscriptionService call
    patterns:
      - pattern-either:
          - pattern: $SERVICE.subscribe(...)
          - pattern: $SERVICE.unsubscribe(...)
          - pattern: $SERVICE.isSubscribed(...)
          - pattern: $SERVICE.findSubscribersBySkillId(...)
      - metavariable-type:
          metavariable: $SERVICE
          type: SkillSubscriptionService

  - id: published-event-producer
    languages: [java]
    severity: INFO
    message: SkillPublishedEvent producer
    pattern: $PUBLISHER.publishEvent(new SkillPublishedEvent(...))

  - id: yanked-event-producer
    languages: [java]
    severity: INFO
    message: SkillVersionYankedEvent producer
    pattern-either:
      - pattern: $PUBLISHER.publishEvent(new SkillVersionYankedEvent(...))
      - pattern: $PUBLISHER.publishEvent(new $PACKAGE.SkillVersionYankedEvent(...))

  - id: event-listener-method
    languages: [java]
    severity: INFO
    message: Transactional event listener method
    patterns:
      - pattern: |
          @TransactionalEventListener(...)
          $RET $METHOD($EVENT $ARG) { ... }

  - id: notification-dispatch-call
    languages: [java]
    severity: INFO
    message: Notification dispatch call
    patterns:
      - pattern: $DISPATCHER.dispatch(...)
      - metavariable-type:
          metavariable: $DISPATCHER
          type: NotificationDispatcher

  - id: subscription-repository-read-write
    languages: [java]
    severity: INFO
    message: Subscription persistence read/write
    patterns:
      - pattern-either:
          - pattern: $REPOSITORY.save(...)
          - pattern: $REPOSITORY.delete(...)
          - pattern: $REPOSITORY.deleteBySkillId(...)
          - pattern: $REPOSITORY.findBySkillIdAndUserId(...)
          - pattern: $REPOSITORY.findAllBySkillId(...)
          - pattern: $REPOSITORY.findByUserId(...)
      - metavariable-type:
          metavariable: $REPOSITORY
          type: SkillSubscriptionRepository

  - id: namespace-membership-authority-read
    languages: [java]
    severity: INFO
    message: Namespace membership authority read
    patterns:
      - pattern-either:
          - pattern: $REPOSITORY.findByNamespaceIdAndUserId(...)
          - pattern: $REPOSITORY.findByNamespaceIdAndUserIdIn(...)
          - pattern: $REPOSITORY.findByUserId(...)
      - metavariable-type:
          metavariable: $REPOSITORY
          type: NamespaceMemberRepository

  - id: rbac-authority-read
    languages: [java]
    severity: INFO
    message: RBAC authority read
    patterns:
      - pattern-either:
          - pattern: $SERVICE.getUserRoleCodes(...)
          - pattern: $SERVICE.getUserRoleCodesByUserIds(...)
          - pattern: $SERVICE.getUserPermissions(...)
          - pattern: $SERVICE.hasPermission(...)
          - pattern: $SERVICE.hasRole(...)
      - metavariable-type:
          metavariable: $SERVICE
          type: RbacService

  - id: user-account-authority-read
    languages: [java]
    severity: INFO
    message: User account status authority read
    patterns:
      - pattern-either:
          - pattern: $REPOSITORY.findById(...)
          - pattern: $REPOSITORY.findByIdIn(...)
      - metavariable-type:
          metavariable: $REPOSITORY
          type: UserAccountRepository

  - id: notification-persist
    languages: [java]
    severity: INFO
    message: Notification persistence sink
    patterns:
      - pattern: $SERVICE.create($RECIPIENT, ...)
      - metavariable-type:
          metavariable: $SERVICE
          type: NotificationService

  - id: notification-sse-push
    languages: [java]
    severity: INFO
    message: Notification SSE transport sink
    patterns:
      - pattern: $MANAGER.push($RECIPIENT, ...)
      - metavariable-type:
          metavariable: $MANAGER
          type: SseEmitterManager
